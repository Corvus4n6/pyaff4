name: Build standalone binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - os: ubuntu-22.04
            artifact_name: aff4-linux-x86_64
            binary_path: dist/aff4
            use_docker: true

          # ── Linux ARM64 ───────────────────────────────────────────────────
          - os: ubuntu-22.04-arm
            artifact_name: aff4-linux-arm64
            binary_path: dist/aff4
            use_docker: true

          # ── Windows x86_64 ────────────────────────────────────────────────
          - os: windows-latest
            artifact_name: aff4-windows-x86_64
            binary_path: dist/aff4.exe
            use_docker: false

          # ── macOS x86_64 (Intel, macos-13 is the last Intel runner) ───────
          - os: macos-13
            artifact_name: aff4-macos-x86_64
            binary_path: dist/aff4
            use_docker: false

          # ── macOS ARM64 (Apple Silicon) ───────────────────────────────────
          - os: macos-14
            artifact_name: aff4-macos-arm64
            binary_path: dist/aff4
            use_docker: false

    steps:
      - uses: actions/checkout@v4

      # ── Windows / macOS ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        if: ${{ !matrix.use_docker }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps and build
        if: ${{ !matrix.use_docker }}
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller aff4.spec

      # ── Linux (Debian 11 / glibc 2.31, native arch) ───────────────────────
      # python:3.11-slim-bullseye is a multi-arch image; Docker pulls the
      # variant matching the runner (amd64 or arm64) automatically.
      - name: Build in python:3.11-slim-bullseye container
        if: ${{ matrix.use_docker }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim-bullseye \
            bash -c "
              set -e
              apt-get update -qq && apt-get install -y --no-install-recommends binutils g++
              pip install -r requirements.txt pyinstaller
              pyinstaller aff4.spec
            "

      - name: Smoke test
        run: ${{ matrix.binary_path }} --help

      - name: Install test dependencies
        if: ${{ !matrix.use_docker }}
        run: pip install pytest

      - name: Install test dependencies (Linux Docker host)
        if: ${{ matrix.use_docker }}
        run: pip install pytest

      - name: Run CLI integration tests
        run: pytest tests/test_cli_flags.py -v --binary ${{ matrix.binary_path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 30
