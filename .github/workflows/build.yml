name: Build standalone binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: aff4-linux-x86_64
            binary_path: dist/aff4
            manylinux: true
          - os: windows-latest
            artifact_name: aff4-windows-x86_64
            binary_path: dist/aff4.exe
            manylinux: false
          - os: macos-latest
            artifact_name: aff4-macos-x86_64
            binary_path: dist/aff4
            manylinux: false

    steps:
      - uses: actions/checkout@v4

      # ── Windows / macOS ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        if: ${{ !matrix.manylinux }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps and build
        if: ${{ !matrix.manylinux }}
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller aff4.spec

      # ── Linux (Debian 11 / glibc 2.31) ────────────────────────────────────
      # python:3.11-slim-bullseye is built with --enable-shared (required by
      # PyInstaller) and targets glibc 2.31, covering Ubuntu 20.04+,
      # Debian 11+, Fedora 32+. manylinux containers cannot be used here
      # because their Python builds omit the shared library.
      - name: Build in python:3.11-slim-bullseye container
        if: ${{ matrix.manylinux }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim-bullseye \
            bash -c "
              set -e
              pip install -r requirements.txt pyinstaller
              pyinstaller aff4.spec
            "

      - name: Smoke test
        run: ${{ matrix.binary_path }} --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 30
