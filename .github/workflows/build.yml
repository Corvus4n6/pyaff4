name: Build standalone binaries

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 ──────────────────────────────────────────────────
          - os: ubuntu-22.04
            artifact_name: aff4-linux-x86_64
            binary_path: dist/aff4
            gui_binary_path: dist/aff4-gui
            gui_artifact_name: aff4-gui-linux-x86_64
            use_docker: true

          # ── Linux ARM64 ───────────────────────────────────────────────────
          - os: ubuntu-22.04-arm
            artifact_name: aff4-linux-arm64
            binary_path: dist/aff4
            gui_binary_path: dist/aff4-gui
            gui_artifact_name: aff4-gui-linux-arm64
            use_docker: true

          # ── Windows x86_64 ────────────────────────────────────────────────
          - os: windows-latest
            artifact_name: aff4-windows-x86_64
            binary_path: dist/aff4.exe
            gui_binary_path: dist/aff4-gui.exe
            gui_artifact_name: aff4-gui-windows-x86_64
            use_docker: false

          # ── macOS ARM64 (Apple Silicon; runs via Rosetta 2 on Intel) ─────
          - os: macos-14
            artifact_name: aff4-macos-arm64
            binary_path: dist/aff4
            gui_binary_path: dist/aff4-gui
            gui_artifact_name: aff4-gui-macos-arm64
            use_docker: false

    steps:
      - uses: actions/checkout@v4

      # ── Windows / macOS ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        if: ${{ !matrix.use_docker }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps and build
        if: ${{ !matrix.use_docker }}
        run: |
          pip install -r requirements.txt pyinstaller PySide6
          pyinstaller aff4.spec

      - name: Build GUI binary
        if: ${{ !matrix.use_docker }}
        run: |
          pyinstaller aff4-gui.spec

      # ── Linux (Debian 11 / glibc 2.31, native arch) ───────────────────────
      # python:3.11-slim-bullseye is a multi-arch image; Docker pulls the
      # variant matching the runner (amd64 or arm64) automatically.
      - name: Build in python:3.11-slim-bullseye container
        if: ${{ matrix.use_docker }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim-bullseye \
            bash -c "
              set -e
              for i in 1 2 3; do
                apt-get update -qq && \
                apt-get install -y --no-install-recommends \
                  binutils g++ \
                  libbrotli1 \
                  libdbus-1-3 \
                  libegl1 \
                  libfontconfig1 \
                  libfreetype6 \
                  libgl1 \
                  libglib2.0-0 \
                  libssl1.1 \
                  libxkbcommon0 && \
                break || { echo \"apt attempt \$i failed, retrying in 15s...\"; sleep 15; }
              done
              pip install -r requirements.txt pyinstaller PySide6
              pyinstaller aff4.spec
              pyinstaller aff4-gui.spec
            "

      - name: Smoke test
        run: ${{ matrix.binary_path }} --help

      - name: Smoke test GUI binary
        run: ${{ matrix.gui_binary_path }} --version
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Install test dependencies
        if: ${{ !matrix.use_docker }}
        run: pip install pytest

      - name: Install test dependencies (Linux Docker host)
        if: ${{ matrix.use_docker }}
        run: pip install pytest

      - name: Run CLI integration tests
        run: pytest tests/test_cli_flags.py -v --binary ${{ matrix.binary_path }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui_artifact_name }}
          path: ${{ matrix.gui_binary_path }}
          if-no-files-found: error
          retention-days: 30
