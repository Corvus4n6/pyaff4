name: Build Linux x86_64 binary (manual)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (aff4-linux-x86_64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Build in python:3.11-slim-bullseye container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            python:3.11-slim-bullseye \
            bash -c "
              set -e
              apt-get update -qq && apt-get install -y --no-install-recommends binutils g++
              pip install -r requirements.txt pyinstaller
              pyinstaller aff4.spec
            "

      - name: Smoke test
        run: dist/aff4 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aff4-linux-x86_64
          path: dist/aff4
          if-no-files-found: error
          retention-days: 30
